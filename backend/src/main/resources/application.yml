spring:
  application:
    name: nextrole-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nextrole}
    username: ${SPRING_DATASOURCE_USERNAME:nextrole}
    password: ${SPRING_DATASOURCE_PASSWORD:nextrole}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

jwt:
  secret: ${JWT_SECRET:change-me-in-production-min-32-chars}
  expiration-ms: 86400000   # 24 hours

ai-service:
  url: ${AI_SERVICE_URL:http://localhost:8000}

logging:
  level:
    com.nextrole: DEBUG
